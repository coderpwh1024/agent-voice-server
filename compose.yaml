name: agent-service-toolkit

services:
  postgres:
    image: pgvector/pgvector:0.8.2-pg16
    ports:
      - "${POSTGRES_HOST_PORT:-5432}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-agent_service}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_HOST_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  agent_service:
    build:
      context: .
      dockerfile: docker/Dockerfile.service
    ports:
      - "${AGENT_HOST_PORT:-8080}:8080"
    env_file:
      - path: .env
        required: false
      - path: config/environments/${APP_ENV:-local}.env
        required: true
      - path: .env.${APP_ENV:-local}
        required: false
      - path: config/environments/${APP_ENV:-local}.compose.env
        required: true
    environment:
      # Prefer values inherited by `docker compose` from the host shell. Compose
      # also uses a project .env file for interpolation when one is present.
      DASHSCOPE_API_KEY: ${DASHSCOPE_API_KEY:-}
      DASHSCOPE_BASE_URL: ${DASHSCOPE_BASE_URL:-https://dashscope.aliyuncs.com/compatible-mode/v1}
      DASHSCOPE_EXPLICIT_CACHE_ENABLED: ${DASHSCOPE_EXPLICIT_CACHE_ENABLED:-false}
      CHAT_LLM_ENABLE_THINKING: ${CHAT_LLM_ENABLE_THINKING:-false}
      DASHSCOPE_EMBEDDING_MODEL: ${DASHSCOPE_EMBEDDING_MODEL:-qwen3.7-text-embedding}
      AUTH_SECRET: ${AUTH_SECRET:-}
      APP_TOKEN_TTL_SECONDS: ${APP_TOKEN_TTL_SECONDS:-1296000}
      EMAIL_AUTH_ENABLED: ${EMAIL_AUTH_ENABLED:-false}
      AUTH_SERVICE_ACCOUNT_ID: ${AUTH_SERVICE_ACCOUNT_ID:-0}
      VIDEO_ENABLED: ${VIDEO_ENABLED:-false}
      VIDEO_API_BASE_URL: ${VIDEO_API_BASE_URL:-https://dashscope.aliyuncs.com/api/v1}
      VIDEO_SKILL_ENABLED: ${VIDEO_SKILL_ENABLED:-false}
      VIDEO_SKILL_VERSION: ${VIDEO_SKILL_VERSION:-}
      VIDEO_SKILL_LABEL: ${VIDEO_SKILL_LABEL:-latest}
      VIDEO_SKILL_TIMEOUT_SECONDS: ${VIDEO_SKILL_TIMEOUT_SECONDS:-20}
      QINIU_ACCESS_KEY: ${QINIU_ACCESS_KEY:-}
      QINIU_SECRET_KEY: ${QINIU_SECRET_KEY:-}
      QINIU_BUCKET_NAME: ${QINIU_BUCKET_NAME:-}
      QINIU_PUBLIC_BASE_URL: ${QINIU_PUBLIC_BASE_URL:-}
      FILE_UPLOAD_ENABLED: ${FILE_UPLOAD_ENABLED:-false}
      FILE_UPLOAD_MAX_BYTES: ${FILE_UPLOAD_MAX_BYTES:-20971520}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      VOICE_ENABLED: ${VOICE_ENABLED:-false}
      VOICE_REALTIME_URL: ${VOICE_REALTIME_URL:-wss://dashscope.aliyuncs.com/api-ws/v1/realtime}
      VOICE_REALTIME_PROXY: ${VOICE_REALTIME_PROXY:-}
      VOICE_REALTIME_STT_MODEL: ${VOICE_REALTIME_STT_MODEL:-qwen3-asr-flash-realtime}
      VOICE_REALTIME_TTS_MODEL: ${VOICE_REALTIME_TTS_MODEL:-qwen3-tts-flash-realtime}
      VOICE_REALTIME_STT_PROTOCOL: ${VOICE_REALTIME_STT_PROTOCOL:-auto}
      VOICE_REALTIME_TTS_PROTOCOL: ${VOICE_REALTIME_TTS_PROTOCOL:-auto}
      VOICE_REALTIME_STT_URL: ${VOICE_REALTIME_STT_URL:-}
      VOICE_REALTIME_TTS_URL: ${VOICE_REALTIME_TTS_URL:-}
      VOICE_REALTIME_VOICES_MODEL: ${VOICE_REALTIME_VOICES_MODEL:-}
      VOICE_REALTIME_VOICE_CATALOG: ${VOICE_REALTIME_VOICE_CATALOG:-}
      VOICE_MAX_SESSIONS: ${VOICE_MAX_SESSIONS:-8}
      VOICE_SESSION_SECONDS: ${VOICE_SESSION_SECONDS:-1800}
      VOICE_IDLE_SECONDS: ${VOICE_IDLE_SECONDS:-120}
      VOICE_QUEUE_SIZE: ${VOICE_QUEUE_SIZE:-64}
      VOICE_VAD_SILENCE_MS: ${VOICE_VAD_SILENCE_MS:-500}
      VOICE_VAD_THRESHOLD: ${VOICE_VAD_THRESHOLD:-0.2}
      VOICE_WAKE_ENABLED: ${VOICE_WAKE_ENABLED:-true}
      VOICE_WAKE_WORD: ${VOICE_WAKE_WORD:-小美}
      VOICE_WAKE_CONFIRM_WITH_ASR: ${VOICE_WAKE_CONFIRM_WITH_ASR:-true}
      VOICE_WAKE_PRE_ROLL_MS: ${VOICE_WAKE_PRE_ROLL_MS:-1200}
      VOICE_WAKE_KWS_SCORE: ${VOICE_WAKE_KWS_SCORE:-1.0}
      VOICE_WAKE_KWS_THRESHOLD: ${VOICE_WAKE_KWS_THRESHOLD:-0.5}
      VOICE_CLIENT_VAD_RMS_DBFS: ${VOICE_CLIENT_VAD_RMS_DBFS:--42}
      VOICE_CLIENT_VAD_FRAMES: ${VOICE_CLIENT_VAD_FRAMES:-3}
      VOICE_AUDIO_METRICS_SECONDS: ${VOICE_AUDIO_METRICS_SECONDS:-5}
      DATABASE_TYPE: postgres
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-agent_service}
      MEM0_ENABLED: ${MEM0_ENABLED:-false}
      LOCAL_MEMORY_ENABLED: ${LOCAL_MEMORY_ENABLED:-true}
      LOCAL_MEMORY_EXTRACTION_TIMEOUT_SECONDS: ${LOCAL_MEMORY_EXTRACTION_TIMEOUT_SECONDS:-20}
      LOCAL_MEMORY_CONTEXT_TIMEOUT_SECONDS: ${LOCAL_MEMORY_CONTEXT_TIMEOUT_SECONDS:-3}
      MEM0_COLLECTION_NAME: ${MEM0_COLLECTION_NAME:-mem0_chat}
      MEM0_API_KEY: ${MEM0_API_KEY:-}
      MEM0_BASE_URL: ${MEM0_BASE_URL:-}
      MEM0_LLM_MODEL: ${MEM0_LLM_MODEL:-qwen-plus}
      MEM0_EMBEDDING_MODEL: ${MEM0_EMBEDDING_MODEL:-}
      MEM0_EMBEDDING_DIMS: ${MEM0_EMBEDDING_DIMS:-1024}
      MEM0_TOP_K: ${MEM0_TOP_K:-5}
      MEM0_THRESHOLD: ${MEM0_THRESHOLD:-0.3}
      MEM0_TIMEOUT_SECONDS: ${MEM0_TIMEOUT_SECONDS:-20}
      MEM0_MAX_CONTEXT_CHARS: ${MEM0_MAX_CONTEXT_CHARS:-6000}
      MEM0_CHAT_CONTEXT_TOKENS: ${MEM0_CHAT_CONTEXT_TOKENS:-12000}
      LOG_FORMAT: ${LOG_FORMAT:-json}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 5s
      timeout: 5s
      retries: 5
    # Volume mount of development-only credentials since compose watch doesn't sync ignored files and doesn't do initial sync when the service starts
    volumes:
      - ./privatecredentials:/privatecredentials
    develop:
      watch:
        - path: app/
          action: sync+restart
          target: /app/app/
  streamlit_app:
    build:
      context: .
      dockerfile: docker/Dockerfile.app
    ports:
      - "8501:8501"
    depends_on:
      - agent_service
    env_file:
      - path: .env
        required: false
      - path: config/environments/${APP_ENV:-local}.env
        required: true
      - path: .env.${APP_ENV:-local}
        required: false
      - path: config/environments/${APP_ENV:-local}.compose.env
        required: true
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8501/healthz"]
      interval: 5s
      timeout: 5s
      retries: 5
    environment:
      AGENT_URL: http://agent_service:8080
      AUTH_SECRET: ${AUTH_SECRET:-}
      DASHSCOPE_API_KEY: ${DASHSCOPE_API_KEY:-}
      DASHSCOPE_BASE_URL: ${DASHSCOPE_BASE_URL:-https://dashscope.aliyuncs.com/compatible-mode/v1}
      DASHSCOPE_EXPLICIT_CACHE_ENABLED: ${DASHSCOPE_EXPLICIT_CACHE_ENABLED:-false}
      CHAT_LLM_ENABLE_THINKING: ${CHAT_LLM_ENABLE_THINKING:-false}
      DASHSCOPE_NATIVE_BASE_URL: ${DASHSCOPE_NATIVE_BASE_URL:-https://dashscope.aliyuncs.com/api/v1}
    develop:
      watch:
        - path: client/
          action: sync+restart
          target: /app/client/
        - path: app/schemas/
          action: sync+restart
          target: /app/app/schemas/
        - path: streamlit_app.py
          action: sync+restart
          target: /app/streamlit_app.py
        - path: app/services/voice/
          action: sync+restart
          target: /app/app/services/voice/

volumes:
  postgres_data:
  redis_data:
