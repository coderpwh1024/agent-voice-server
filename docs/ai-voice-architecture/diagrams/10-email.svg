<text x="42" y="581" font-family="PingFang SC, Noto Sans SC, Microsoft YaHei, sans-serif" font-size="16" font-weight="600" fill="#16243B" text-anchor="start">定时只接受未来 24 小时内的带时区时间；停止语音不撤销已提交任务。</text>
